# Baseline: standard causal softmax attention (plan §2 B, initial configuration — Member 1 may adjust).
# Keep every key except `attention` identical in efficient_attention.yaml (controlled comparison).
run_name: baseline_standard
seed: 42
model:
  vocab_size: 8000        # set to the trained tokenizer's vocab_size
  n_layer: 4
  n_head: 4
  d_model: 256
  context_length: 256
  dropout: 0.1
  attention: standard
train:
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 10000        # same token budget for both variants
  eval_interval: 250
  eval_batches: 50
data:
  train_tokens: data/tinystories_train.bin
  val_tokens: data/tinystories_val.bin
  tokenizer: checkpoints/tokenizer.json
