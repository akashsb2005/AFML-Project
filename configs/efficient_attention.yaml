# Efficient variant: identical to baseline.yaml except attention.
run_name: efficient_linear
seed: 42
model:
  vocab_size: 8000
  n_layer: 4
  n_head: 4
  d_model: 256
  context_length: 256
  dropout: 0.1
  attention: linear
train:
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 10000
  eval_interval: 250
  eval_batches: 50
data:
  train_jsonl: data/processed/tiny_stories_train.jsonl
  validation_jsonl: data/processed/tiny_stories_validation.jsonl
  tokenizer: artifacts/tokenizer/tokenizer.json
